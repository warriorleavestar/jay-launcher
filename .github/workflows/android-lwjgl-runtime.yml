name: android-lwjgl-runtime

on:
  pull_request:
    paths:
      - '.github/workflows/android-lwjgl-runtime.yml'
      - 'scripts/build-android-lwjgl.sh'
      - 'third_party/android-lwjgl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-v8a, x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build LWJGL JNI libraries
        run: |
          bash scripts/build-android-lwjgl.sh \
            "$ANDROID_HOME/ndk/28.2.13676358" \
            "${{ matrix.architecture }}" \
            "lwjgl-${{ matrix.architecture }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-lwjgl-${{ matrix.architecture }}
          path: lwjgl-${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 14
