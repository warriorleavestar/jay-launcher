name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_android_preview:
        description: Publish the Android APK as the android-preview pre-release
        type: boolean
        default: false

# 同一个 PR 推了新提交时，取消旧提交还在排队或在跑的检查；main 和标签上的不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Amber.slnx

      - name: Build
        run: dotnet build Amber.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Amber.Core.Tests -c Release --no-build

      # 界面自检（AMBER_SELFTEST）要真实窗口、联网下载游戏和启动 Java，CI 上不跑，发布前在本机跑 tools/run-selftest.ps1。

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_android_preview
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # PR 上不打 Intel Mac 包（GitHub 免费账号 Mac 机器很少，排队最久）；main 和发版标签照常打全部五个平台。
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","rid":"win-x64","archive":"zip"},{"os":"macos-15","rid":"osx-arm64","archive":"tar"},{"os":"ubuntu-latest","rid":"linux-x64","archive":"tar"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","archive":"tar"}]' || '[{"os":"windows-latest","rid":"win-x64","archive":"zip"},{"os":"macos-15-intel","rid":"osx-x64","archive":"tar"},{"os":"macos-15","rid":"osx-arm64","archive":"tar"},{"os":"ubuntu-latest","rid":"linux-x64","archive":"tar"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","archive":"tar"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file ReadyToRun
        run: >-
          dotnet publish Amber.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:DebugType=none
          -o ../out/${{ matrix.rid }}

      - name: Publish Jay Server (single file)
        run: >-
          dotnet publish Amber.Server -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ../out/server-${{ matrix.rid }}

      # 发布包自带 EasyTier 官方安装包（校验固定的 SHA-256），网络不好也能直接用联机。
      - name: Bundle EasyTier
        shell: bash
        run: bash ../scripts/bundle-easytier.sh ${{ matrix.rid }} ../out/${{ matrix.rid }}/easytier

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../packages | Out-Null
          Get-ChildItem ../out/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path ../out/${{ matrix.rid }}/* -DestinationPath ../packages/Jay-${{ matrix.rid }}.zip
          Copy-Item ../server/README.md ../out/server-${{ matrix.rid }}/
          Copy-Item ../docs/network-server.md ../out/server-${{ matrix.rid }}/
          Compress-Archive -Path ../out/server-${{ matrix.rid }}/* -DestinationPath ../packages/JayServer-${{ matrix.rid }}.zip

      - name: Package macOS/Linux
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p ../packages
          find ../out/${{ matrix.rid }} -name '*.pdb' -delete
          chmod +x ../out/${{ matrix.rid }}/Jay
          # Linux 版内置了思源黑体，按 OFL 附上许可证。
          if [[ "${{ matrix.rid }}" == linux-* ]]; then cp Amber.App/Assets/Fonts/OFL.txt ../out/${{ matrix.rid }}/NotoSansSC-OFL.txt; fi
          tar -C ../out/${{ matrix.rid }} -czf ../packages/Jay-${{ matrix.rid }}.tar.gz .
          chmod +x ../out/server-${{ matrix.rid }}/jay-server
          cp ../server/README.md ../server/jay-server.service ../server/jay-public-node.service ../server/install-network-node.sh ../docs/network-server.md ../out/server-${{ matrix.rid }}/
          chmod +x ../out/server-${{ matrix.rid }}/install-network-node.sh
          tar -C ../out/server-${{ matrix.rid }} -czf ../packages/JayServer-${{ matrix.rid }}.tar.gz .

      # Native AOT 会在 Windows/macOS/Linux 托管 runner 上超时或耗尽内存，
      # 并让前面已打好的标准包来不及上传。发布链只生成可靠的 ReadyToRun 自包含包。

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK and JDK
        run: >-
          dotnet build Amber.Android/Amber.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AcceptAndroidSdkLicenses=true

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="${{ runner.temp }}/android-sdk" "ndk;28.2.13676358"

      - name: Build Jay native JVM host
        shell: bash
        run: |
          bash ../scripts/build-android-native.sh \
            "${{ runner.temp }}/android-sdk" \
            Amber.Android/obj/jay-native

      - name: Prepare stable preview signing key
        if: github.event_name == 'workflow_dispatch' && inputs.publish_android_preview
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/jay-android-preview.p12"

      - name: Publish CI APK
        if: github.event_name != 'workflow_dispatch' || !inputs.publish_android_preview
        run: >-
          dotnet publish Amber.Android/Amber.Android.csproj -c Release
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AndroidPackageFormats=apk

      - name: Publish release-signed preview APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_android_preview
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          dotnet publish Amber.Android/Amber.Android.csproj -c Release
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ runner.temp }}/jay-android-preview.p12
          -p:AndroidSigningKeyAlias="$ANDROID_RELEASE_KEY_ALIAS"
          -p:AndroidSigningStorePass="$ANDROID_RELEASE_STORE_PASSWORD"
          -p:AndroidSigningKeyPass="$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Stage APK
        shell: bash
        run: |
          APK_PATH="Amber.Android/bin/Release/net10.0-android/publish/nz.work.minecraft.jay-Signed.apk"
          DISPLAY_VERSION="$(dotnet msbuild Amber.Android/Amber.Android.csproj -getProperty:ApplicationDisplayVersion)"
          BUILD_VERSION="$(dotnet msbuild Amber.Android/Amber.Android.csproj -getProperty:ApplicationVersion)"
          AAPT_PATH="$(find "${{ runner.temp }}/android-sdk/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER_PATH="$(find "${{ runner.temp }}/android-sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          test -n "$APKSIGNER_PATH"
          BADGING="$("$AAPT_PATH" dump badging "$APK_PATH" | head -n 1)"
          [[ "$BADGING" == *"versionName='$DISPLAY_VERSION'"* ]]
          [[ "$BADGING" == *"versionCode='$BUILD_VERSION'"* ]]
          "$APKSIGNER_PATH" verify "$APK_PATH"
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.publish_android_preview }}" == true ]]; then
            CERT_SHA256="$("$APKSIGNER_PATH" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "$CERT_SHA256" = "595779309affcfebd61f591c3127a75c5471fbcd0f192539fbe5f52b951808e0"
          fi
          bash ../scripts/check-android-16k.sh "$APK_PATH" "${{ runner.temp }}/android-sdk"
          mkdir -p ../packages
          cp "$APK_PATH" ../packages/Jay-android-experimental.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android
          path: packages/Jay-android-experimental.apk
          if-no-files-found: error

  android-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_preview
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jay-android
          path: android-assets

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and exercise phone/tablet touch layouts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install android-assets/Jay-android-experimental.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell monkey -p nz.work.minecraft.jay -c android.intent.category.LAUNCHER 1
            sleep 8
            test -n "$(adb shell pidof nz.work.minecraft.jay)"
            adb shell input swipe 540 1900 540 700 500
            adb exec-out screencap -p > android-phone.png
            adb shell am force-stop nz.work.minecraft.jay
            adb shell wm size 2560x1600
            adb shell wm density 320
            adb shell monkey -p nz.work.minecraft.jay -c android.intent.category.LAUNCHER 1
            sleep 5
            test -n "$(adb shell pidof nz.work.minecraft.jay)"
            adb shell input tap 1280 800
            adb shell input swipe 2100 1300 2100 500 500
            sleep 2
            test -n "$(adb shell pidof nz.work.minecraft.jay)"
            adb exec-out screencap -p > android-tablet.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android-smoke-screenshots
          path: android-*.png
          if-no-files-found: error

  publish-android-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_preview
    needs: [android, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jay-android
          path: android-assets

      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd android-assets
          test -s Jay-android-experimental.apk
          sha256sum Jay-android-experimental.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          直接下载 Jay-android-experimental.apk。支持 Android 6.0 及以上的 ARM64 和 x86_64 设备。

          手机和窄分屏采用单栏，宽屏平板采用双栏，旋转或调整窗口时自动重排。按钮和邀请码输入框已针对触控调整。

          这是 Jay 的 Android 实验版。通过邀请码登记并开启网关后，可以进入 Jay 自己的全屏游戏画面和触屏控制层，不再跳转或依赖 FCL。独立 JVM、图形桥、账号与游戏下载仍在开发，当前预览版还不能真正启动 Minecraft。

          此发布从本版起使用固定的预览版签名，以后可覆盖升级并保留语言、设备身份和已保存的服务器。若此前安装过其他签名的测试包，Android 仍会拒绝首次覆盖安装。
          NOTES
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # android-preview is a moving preview channel. Keep its tag, assets and notes on the
            # exact commit that produced the APK instead of failing after the first publication.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-preview" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload android-preview Jay-android-experimental.apk SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-preview \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jay Android 预览版" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create android-preview Jay-android-experimental.apk SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jay Android 预览版" \
              --notes-file release-notes.md \
              --prerelease
          fi

  ios:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_android_preview
    # Keep the platform compile independent so a desktop-only/flaky test cannot hide iOS compiler failures.
    # .NET 10.0.403 installs the iOS 27.1 workload; this image has matching Xcode 27.1 as its default.
    # Pinned: 10.0.404 brings iOS 27.2, which refuses Xcode 27.1. Move both together when the image gets Xcode 27.2.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'

      - name: Install iOS workload
        # setup-dotnet 只锁 SDK 还不够；workload 默认会更新到最新 feature band。
        run: dotnet workload install ios --version 10.0.403

      - name: Build experimental iOS Simulator app
        run: >-
          dotnet build Amber.iOS/Amber.iOS.csproj -c Release
          -r iossimulator-arm64 -p:CodesignKey=-

      - name: Stage simulator app
        shell: bash
        run: |
          APP_PATH="$(find Amber.iOS/bin/Release/net10.0-ios/iossimulator-arm64 -type d -name 'Jay.app' -print -quit)"
          test -n "$APP_PATH"
          DISPLAY_VERSION="$(dotnet msbuild Amber.iOS/Amber.iOS.csproj -getProperty:ApplicationDisplayVersion)"
          BUILD_VERSION="$(dotnet msbuild Amber.iOS/Amber.iOS.csproj -getProperty:ApplicationVersion)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "$DISPLAY_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUILD_VERSION"
          mkdir -p ../packages
          tar -C "$(dirname "$APP_PATH")" -czf ../packages/Jay-ios-simulator-arm64-experimental.tar.gz "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-ios-simulator
          path: packages/Jay-ios-simulator-arm64-experimental.tar.gz
          if-no-files-found: error

  # Windows 代码签名（SignPath Foundation）。只在发布标签上跑，并且要先在仓库设置里配好
  # 变量 SIGNPATH_ORGANIZATION_ID 和密钥 SIGNPATH_API_TOKEN，没配时整个任务跳过，发布照旧（未签名）。
  # 每次签名都要在 SignPath 网页上人工批准，所以等待时间放宽到 1 小时。
  # 签名范围见 .signpath/artifact-configuration.xml，政策见 docs/code-signing-policy.md。
  sign-windows:
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find unsigned Windows artifact
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "jay-win-x64") | .id')"
          test -n "$id"
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'jay-launcher' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.unsigned.outputs.version) }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-jay-win-x64
          path: signed/*
          if-no-files-found: error

  release:
    # 签名任务跳过（没配置 SignPath）时照常发布；签名失败或被拒时不发布，避免把未签名的包当成正式版发出去。
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.publish.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    needs: [publish, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: jay-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.sign-windows.result == 'success'
        with:
          name: signed-jay-win-x64
          path: signed-assets

      - name: Use signed Windows packages
        if: needs.sign-windows.result == 'success'
        run: |
          for f in Jay-win-x64.zip JayServer-win-x64.zip; do
            test -f "signed-assets/$f"
            cp -f "signed-assets/$f" "release-assets/$f"
          done

      # Jay release signature: the maintainer signs this list offline (`jay-server release sign`) and
      # uploads SHA256SUMS.txt.sig to the release; see docs/security/release-signing.md.
      - name: SHA-256 list
        run: |
          cd release-assets
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes "代码签名政策 / Code signing policy: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/code-signing-policy.md" \
            --generate-notes \
            --title "Jay ${GITHUB_REF_NAME}"
