name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Amber.slnx

      - name: Build
        run: dotnet build Amber.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Amber.Core.Tests -c Release --no-build

      # 界面自检（AMBER_SELFTEST）要真实窗口、联网下载游戏和启动 Java，CI 上不跑，发布前在本机跑 tools/run-selftest.ps1。

  publish:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-15-intel
            rid: osx-x64
            archive: tar
          - os: macos-15
            rid: osx-arm64
            archive: tar
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: tar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file ReadyToRun
        run: >-
          dotnet publish Amber.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:DebugType=none
          -o ../out/${{ matrix.rid }}

      - name: Publish Jay Server (single file)
        run: >-
          dotnet publish Amber.Server -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ../out/server-${{ matrix.rid }}

      # 发布包自带 EasyTier 官方安装包（校验固定的 SHA-256），网络不好也能直接用联机。
      - name: Bundle EasyTier
        shell: bash
        run: bash ../scripts/bundle-easytier.sh ${{ matrix.rid }} ../out/${{ matrix.rid }}/easytier

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../packages | Out-Null
          Get-ChildItem ../out/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path ../out/${{ matrix.rid }}/* -DestinationPath ../packages/Jay-${{ matrix.rid }}.zip
          Copy-Item ../server/README.md ../out/server-${{ matrix.rid }}/
          Compress-Archive -Path ../out/server-${{ matrix.rid }}/* -DestinationPath ../packages/JayServer-${{ matrix.rid }}.zip

      - name: Package macOS/Linux
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p ../packages
          find ../out/${{ matrix.rid }} -name '*.pdb' -delete
          chmod +x ../out/${{ matrix.rid }}/Jay
          tar -C ../out/${{ matrix.rid }} -czf ../packages/Jay-${{ matrix.rid }}.tar.gz .
          chmod +x ../out/server-${{ matrix.rid }}/jay-server
          cp ../server/README.md ../server/jay-server.service ../out/server-${{ matrix.rid }}/
          tar -C ../out/server-${{ matrix.rid }} -czf ../packages/JayServer-${{ matrix.rid }}.tar.gz .

      - name: Publish Windows Native AOT
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet publish Amber.App -c Release -r win-x64 -p:PublishAot=true -p:DebugType=none -o ../out/win-x64-aot
          Get-ChildItem ../out/win-x64-aot -Recurse -Filter *.pdb | Remove-Item
          Copy-Item -Recurse ../out/win-x64/easytier ../out/win-x64-aot/easytier
          Compress-Archive -Path ../out/win-x64-aot/* -DestinationPath ../packages/Jay-win-x64-aot.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK and JDK
        run: >-
          dotnet build Amber.Android/Amber.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AcceptAndroidSdkLicenses=true

      - name: Publish experimental APK
        run: >-
          dotnet publish Amber.Android/Amber.Android.csproj -c Release
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AndroidPackageFormats=apk

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p ../packages
          cp Amber.Android/bin/Release/net10.0-android/publish/nz.work.minecraft.jay-Signed.apk ../packages/Jay-android-experimental.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android
          path: packages/Jay-android-experimental.apk
          if-no-files-found: error

  ios:
    # Keep the platform compile independent so a desktop-only/flaky test cannot hide iOS compiler failures.
    # .NET 10.0.403 installs the iOS 27.1 workload; this image has matching Xcode 27.1 as its default.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build experimental iOS Simulator app
        run: >-
          dotnet build Amber.iOS/Amber.iOS.csproj -c Release
          -r iossimulator-arm64 -p:CodesignKey=-

      - name: Stage simulator app
        shell: bash
        run: |
          APP_PATH="$(find Amber.iOS/bin/Release/net10.0-ios/iossimulator-arm64 -type d -name 'Jay.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p ../packages
          tar -C "$(dirname "$APP_PATH")" -czf ../packages/Jay-ios-simulator-arm64-experimental.tar.gz "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-ios-simulator
          path: packages/Jay-ios-simulator-arm64-experimental.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: jay-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Jay ${GITHUB_REF_NAME}"
