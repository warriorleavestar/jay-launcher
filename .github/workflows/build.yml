name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_android_preview:
        description: Publish the Android APK as the android-preview pre-release
        type: boolean
        default: false

# 同一个 PR 推了新提交时，取消旧提交还在排队或在跑的检查；main 和标签上的不取消
concurrency:
  # Key on ref and SHA so a tag run never queues behind (or is cancelled by) a main or manual run on the same commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Match the signed release tag to the launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = dotnet msbuild Amber.App/Amber.App.csproj -getProperty:Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Release tag must match the launcher version' }

      - name: Restore
        run: dotnet restore Amber.slnx

      - name: Build
        run: dotnet build Amber.slnx -c Release --no-restore

      # build/pins.json is the one list of pinned binaries; fail early when code or scripts disagree with it (docs/pins.md).
      - name: Check pins
        run: dotnet test Amber.Core.Tests -c Release --no-build --filter "FullyQualifiedName~Amber.Core.Tests.PinsTests"

      - name: Unit tests
        run: dotnet test Amber.Core.Tests -c Release --no-build

      # 界面自检（AMBER_SELFTEST）要真实窗口、联网下载游戏和启动 Java，CI 上不跑，发布前在本机跑 tools/run-selftest.ps1。

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_android_preview
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # PR 上不打 Intel Mac 包（GitHub 免费账号 Mac 机器很少，排队最久）；main 和发版标签照常打全部五个平台。
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","rid":"win-x64","archive":"zip"},{"os":"macos-15","rid":"osx-arm64","archive":"dmg"},{"os":"ubuntu-latest","rid":"linux-x64","archive":"tar"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","archive":"tar"}]' || '[{"os":"windows-latest","rid":"win-x64","archive":"zip"},{"os":"macos-15-intel","rid":"osx-x64","archive":"dmg"},{"os":"macos-15","rid":"osx-arm64","archive":"dmg"},{"os":"ubuntu-latest","rid":"linux-x64","archive":"tar"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","archive":"tar"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Require CurseForge key on release tags
        # 标签上的构建（推送或手动运行）都会发版，所以下面在标签上一定注入 Key，这里一定检查。
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          JAY_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        # 只判断是否为空，不输出值；secret 没配时正式版不能悄悄不带 Key 发出去。
        run: |
          if [ -z "$JAY_CURSEFORGE_API_KEY" ]; then
            echo "::error::CURSEFORGE_API_KEY secret is empty; release builds must include the CurseForge key."
            exit 1
          fi

      - name: Publish single-file ReadyToRun
        env:
          # CurseForge 第三方 API Key（仓库 secret）只在推到 main 和标签上的构建里编进程序（on.push 只含 main 和 v* 标签）；
          # 在标签上手动运行也会发版，所以同样注入。PR 构建不带，见 Amber.Core.csproj。
          JAY_CURSEFORGE_API_KEY: ${{ (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')) && secrets.CURSEFORGE_API_KEY || '' }}
        run: >-
          dotnet publish Amber.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:DebugType=none
          -o ../out/${{ matrix.rid }}
          ${{ matrix.rid == 'win-x64' && '-p:RequireJayDns=true' || '' }}

      - name: Publish Jay Server (single file)
        run: >-
          dotnet publish Amber.Server -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ../out/server-${{ matrix.rid }}

      # 发布包自带 EasyTier 的 Jay 加固版（校验固定的 SHA-256），网络不好也能直接用联机。
      - name: Bundle EasyTier
        shell: bash
        run: bash ../scripts/bundle-easytier.sh ${{ matrix.rid }} ../out/${{ matrix.rid }}/easytier

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../packages | Out-Null
          Get-ChildItem ../out/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path ../out/${{ matrix.rid }}/* -DestinationPath ../packages/Jay-${{ matrix.rid }}.zip
          $version = dotnet msbuild Amber.App/Amber.App.csproj -getProperty:Version
          $pin = (Get-Content ../build/pins.json -Raw | ConvertFrom-Json).pins | Where-Object id -eq windows-update-compiler
          $setup = Join-Path $env:RUNNER_TEMP $pin.file
          Invoke-WebRequest $pin.urls[0] -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne $pin.sha256) { throw "Inno Setup checksum mismatch" }
          $compiler = Join-Path $env:RUNNER_TEMP 'jay-inno'
          $tool = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$compiler`"") -PassThru -Wait
          if ($tool.ExitCode -ne 0) { throw "Compiler setup failed: $($tool.ExitCode)" }
          & "$compiler\ISCC.exe" "/DJayVersion=$version" ../scripts/jay-windows-update.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path ../packages/Jay-win-x64-setup.exe)) { throw "Missing Windows update installer" }
          # Exercise an existing portable install, including a save in a user-chosen sibling folder.
          $fixture = Join-Path $env:RUNNER_TEMP 'Jay update test'
          $world = Join-Path $fixture 'instances/test/saves/world'
          New-Item -ItemType Directory -Force $world | Out-Null
          Set-Content "$world/level.dat" 'existing-save' -NoNewline
          Set-Content "$fixture/Jay.exe" 'old-launcher'
          $up = Start-Process ../packages/Jay-win-x64-setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$fixture`"") -PassThru -Wait
          if ($up.ExitCode -ne 0 -or (Get-FileHash "$fixture/Jay.exe").Hash -ne (Get-FileHash ../out/win-x64/Jay.exe).Hash -or (Get-Content "$world/level.dat" -Raw) -ne 'existing-save') { throw 'In-place Windows update failed' }
          Copy-Item ../server/README.md ../out/server-${{ matrix.rid }}/
          Copy-Item ../docs/network-server.md ../out/server-${{ matrix.rid }}/
          Compress-Archive -Path ../out/server-${{ matrix.rid }}/* -DestinationPath ../packages/JayServer-${{ matrix.rid }}.zip

      - name: Package macOS app and DMG
        if: matrix.archive == 'dmg'
        shell: bash
        run: |
          find ../out/${{ matrix.rid }} -name '*.pdb' -delete
          bash ../scripts/publish-macos.sh "${{ matrix.rid }}" "../out/${{ matrix.rid }}" "../packages"
          # Only the disposable CI runner gets this system-wide installation.
          app=/Applications/Jay.app
          test ! -e "$app"
          sudo mkdir -p "$app/Contents/MacOS"
          sudo cp /usr/bin/true "$app/Contents/MacOS/Jay"
          sudo /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string nz.work.minecraft.jay' "$app/Contents/Info.plist"
          sudo /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 0.0.1' "$app/Contents/Info.plist"
          sudo /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string Jay' "$app/Contents/Info.plist"
          save="$RUNNER_TEMP/Jay test game/saves/world/level.dat"
          mkdir -p "$(dirname "$save")"
          printf 'existing-save' > "$save"
          sudo /usr/sbin/installer -pkg "../packages/Jay-${{ matrix.rid }}.pkg" -target /
          test "$(cat "$save")" = existing-save
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" != 0.0.1
          codesign --verify --deep --strict "$app"
          chmod +x ../out/server-${{ matrix.rid }}/jay-server
          cp ../server/README.md ../docs/network-server.md ../out/server-${{ matrix.rid }}/
          tar -C ../out/server-${{ matrix.rid }} -czf ../packages/JayServer-${{ matrix.rid }}.tar.gz .

      - name: Package Linux
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p ../packages
          find ../out/${{ matrix.rid }} -name '*.pdb' -delete
          chmod +x ../out/${{ matrix.rid }}/Jay
          # Linux 版内置了思源黑体，按 OFL 附上许可证。
          cp Amber.App/Assets/Fonts/OFL.txt ../out/${{ matrix.rid }}/NotoSansSC-OFL.txt
          tar -C ../out/${{ matrix.rid }} -czf ../packages/Jay-${{ matrix.rid }}.tar.gz .
          chmod +x ../out/server-${{ matrix.rid }}/jay-server
          cp ../server/README.md ../server/jay-server.service ../server/jay-public-node.service ../server/install-network-node.sh ../docs/network-server.md ../out/server-${{ matrix.rid }}/
          chmod +x ../out/server-${{ matrix.rid }}/install-network-node.sh
          tar -C ../out/server-${{ matrix.rid }} -czf ../packages/JayServer-${{ matrix.rid }}.tar.gz .

      # Native AOT 会在 Windows/macOS/Linux 托管 runner 上超时或耗尽内存，
      # 并让前面已打好的标准包来不及上传。发布链只生成可靠的 ReadyToRun 自包含包。

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SIGNED_ANDROID: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_preview) }}
      MINECRAFT_LEGACY_INPUT_VERSION: '1.21.11'
      MINECRAFT_NAMED_INPUT_VERSION: '26.3'
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify Android native input queues
        shell: bash
        run: |
          bash ../scripts/check-android-menu-queue.sh
          bash ../scripts/check-android-scalar-queue.sh

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK and JDK
        run: >-
          dotnet build Amber.Android/Amber.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:AcceptAndroidSdkLicenses=true

      - name: Verify Minecraft touch bridge signatures
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl --fail --silent --show-error \
            https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          javap_path="$(find "${{ runner.temp }}/jdk" -type f -name javap -print -quit)"
          test -n "$javap_path"
          check_version() {
            local version_id=$1
            local version_url version_json client_url client_sha1 client_jar
            version_url="$(jq --raw-output --arg id "$version_id" \
              '.versions[] | select(.id == $id) | .url' <<<"$manifest" | head -n 1)"
            test -n "$version_url"
            version_json="$(curl --fail --silent --show-error "$version_url")"
            client_url="$(jq --raw-output '.downloads.client.url' <<<"$version_json")"
            client_sha1="$(jq --raw-output '.downloads.client.sha1' <<<"$version_json")"
            client_jar="${{ runner.temp }}/minecraft-$version_id-client.jar"
            curl --fail --location --retry 2 --output "$client_jar" "$client_url"
            echo "$client_sha1  $client_jar" | sha1sum --check --strict
            JAVAP_BIN="$javap_path" bash ../scripts/check-android-input-bridge.sh "$client_jar"
          }
          check_version "$MINECRAFT_LEGACY_INPUT_VERSION"
          check_version "$MINECRAFT_NAMED_INPUT_VERSION"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${{ runner.temp }}/android-sdk"
          sdkmanager="$(find "$sdk_root" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager" ] && command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          if [ -z "$sdkmanager" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sdkmanager="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::Android sdkmanager was not installed by the .NET workload or runner image."
            exit 1
          fi
          # yes exits non-zero (EPIPE) once sdkmanager stops reading; pipefail would fail the step.
          (yes || true) | "$sdkmanager" \
            --sdk_root="$sdk_root" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Jay native JVM host
        shell: bash
        run: |
          bash ../scripts/build-android-native.sh \
            "${{ runner.temp }}/android-sdk" \
            Amber.Android/obj/jay-native

      - name: Build Jay Android GLFW bridge
        shell: bash
        run: |
          bash ../scripts/build-android-glfw.sh \
            "${{ runner.temp }}/android-sdk" \
            Amber.Android/obj/jay-glfw

      - name: Build pinned SDL Android bridge
        shell: bash
        run: |
          bash ../scripts/build-android-sdl.sh \
            "${{ runner.temp }}/android-sdk" \
            "${{ runner.temp }}/jdk" \
            Amber.Android/obj/jay-sdl

      - name: Stage standalone ANGLE for emulator graphics
        run: python3 ../scripts/fetch-android-angle.py Amber.Android/obj/jay-angle

      - name: Fetch pinned Java 25 runtime catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          catalog="Amber.Android/obj/jay-runtime-catalog"
          rm -rf "$catalog"
          mkdir -p "$catalog"
          if ! gh release download android-runtime-v3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'runtime25-*.json' \
            --dir "$catalog"; then
            rm -f "$catalog"/*
            if [[ "${{ github.event_name }}" == pull_request ]]; then
              echo "::notice::android-runtime-v3 is not published yet; PR APK omits the Java 25 catalog."
              exit 0
            fi
            echo "::error::android-runtime-v3 descriptors are required for downloadable Android builds."
            exit 1
          fi
          for architecture in arm64-v8a x86_64; do
            descriptor="$catalog/runtime25-$architecture.json"
            archive="jay-android-runtime25-$architecture.tar.xz"
            expected_download="${{ github.server_url }}/${{ github.repository }}/releases/download/android-runtime-v3/$archive"
            test -f "$descriptor"
            jq -e \
              --arg architecture "$architecture" \
              --arg id "jay-android-runtime25-v3-$architecture" \
              --arg downloadUrl "$expected_download" \
              '.Format == 1 and .Id == $id and .Architecture == $architecture and
               .ArchiveSize > 0 and (.ArchiveSha256 | test("^[0-9a-f]{64}$")) and
               .MaximumExtractedSize >= .ArchiveSize and .MaximumExtractedSize <= 1073741824 and
               (.License | length) > 0 and (.SourceUrl | startswith("https://")) and
               .DownloadUrl == $downloadUrl' \
              "$descriptor" >/dev/null
          done
          test "$(find "$catalog" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2

      - name: Prepare stable preview signing key
        if: env.RELEASE_SIGNED_ANDROID == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/jay-android-preview.p12"

      - name: Require CurseForge key for downloadable Android builds
        if: env.RELEASE_SIGNED_ANDROID == 'true'
        shell: bash
        env:
          # Keep the key out of PRs, ordinary manual CI and every unrelated Android build step.
          JAY_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$JAY_CURSEFORGE_API_KEY" ]; then
            echo "::error::CURSEFORGE_API_KEY secret is empty; downloadable Android builds must include the CurseForge key."
            exit 1
          fi

      - name: Publish CI APK
        if: env.RELEASE_SIGNED_ANDROID != 'true'
        run: >-
          dotnet publish Amber.Android/Amber.Android.csproj -c Release -m:1
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:JaySdlRuntimeDir=${{ github.workspace }}/src/Amber.Android/obj/jay-sdl
          -p:JayAngleRuntimeDir=${{ github.workspace }}/src/Amber.Android/obj/jay-angle
          -p:JayAndroidRuntimeCatalogDir=${{ github.workspace }}/src/Amber.Android/obj/jay-runtime-catalog
          -p:AndroidPackageFormats=apk

      - name: Publish release-signed preview APK
        if: env.RELEASE_SIGNED_ANDROID == 'true'
        env:
          JAY_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          dotnet publish Amber.Android/Amber.Android.csproj -c Release -m:1
          -p:AndroidSdkDirectory=${{ runner.temp }}/android-sdk
          -p:JavaSdkDirectory=${{ runner.temp }}/jdk
          -p:JaySdlRuntimeDir=${{ github.workspace }}/src/Amber.Android/obj/jay-sdl
          -p:JayAngleRuntimeDir=${{ github.workspace }}/src/Amber.Android/obj/jay-angle
          -p:JayAndroidRuntimeCatalogDir=${{ github.workspace }}/src/Amber.Android/obj/jay-runtime-catalog
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ runner.temp }}/jay-android-preview.p12
          -p:AndroidSigningKeyAlias="$ANDROID_RELEASE_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_RELEASE_STORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_RELEASE_KEY_PASSWORD

      - name: Stage APK
        shell: bash
        run: |
          APK_PATH="Amber.Android/bin/Release/net10.0-android/publish/nz.work.minecraft.jay-Signed.apk"
          DISPLAY_VERSION="$(dotnet msbuild Amber.Android/Amber.Android.csproj -getProperty:ApplicationDisplayVersion)"
          BUILD_VERSION="$(dotnet msbuild Amber.Android/Amber.Android.csproj -getProperty:ApplicationVersion)"
          AAPT_PATH="$(find "${{ runner.temp }}/android-sdk/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER_PATH="$(find "${{ runner.temp }}/android-sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          test -n "$APKSIGNER_PATH"
          BADGING="$("$AAPT_PATH" dump badging "$APK_PATH" | head -n 1)"
          [[ "$BADGING" == *"versionName='$DISPLAY_VERSION'"* ]]
          [[ "$BADGING" == *"versionCode='$BUILD_VERSION'"* ]]
          "$APKSIGNER_PATH" verify "$APK_PATH"
          if compgen -G 'Amber.Android/obj/jay-runtime-catalog/runtime25-*.json' >/dev/null; then
            unzip -Z1 "$APK_PATH" | grep -Fx 'assets/runtime25-arm64-v8a.json'
            unzip -Z1 "$APK_PATH" | grep -Fx 'assets/runtime25-x86_64.json'
          fi
          if [[ "$RELEASE_SIGNED_ANDROID" == true ]]; then
            CERT_SHA256="$("$APKSIGNER_PATH" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "$CERT_SHA256" = "595779309affcfebd61f591c3127a75c5471fbcd0f192539fbe5f52b951808e0"
          fi
          bash ../scripts/check-android-16k.sh "$APK_PATH" "${{ runner.temp }}/android-sdk"
          mkdir -p ../packages
          cp "$APK_PATH" ../packages/Jay-android-experimental.apk
          zip -X -j ../packages/Jay-Vanilla-26.3.mrpack ../instances/vanilla-26.3/modrinth.index.json
          unzip -tq ../packages/Jay-Vanilla-26.3.mrpack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android
          path: |
            packages/Jay-android-experimental.apk
            packages/Jay-Vanilla-26.3.mrpack
          if-no-files-found: error

  android-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_preview)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jay-android
          path: android-assets

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and exercise phone/tablet touch layouts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            bash scripts/check-android-emulator-smoke.sh android-assets/Jay-android-experimental.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android-smoke-screenshots
          path: android-*.png
          if-no-files-found: error

  publish-android-preview:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_preview)
    needs: [android, android-smoke]
    # Two quick pushes to main must not let the older run overwrite the newer preview.
    concurrency:
      group: android-preview-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jay-android
          path: android-assets

      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The concurrency group runs one publish at a time but does not order them, so a run
          # for an older commit can start after a newer one. Only ever move the preview forward.
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-preview" --jq .object.sha 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status)
            case "$status" in
              ahead) ;;
              behind)
                echo "android-preview is already at $current, newer than $GITHUB_SHA. Skipping."
                exit 0 ;;
              *)
                echo "::warning::android-preview ($current) and $GITHUB_SHA have diverged ($status). Skipping."
                exit 0 ;;
            esac
          fi
          cd android-assets
          test -s Jay-android-experimental.apk
          sha256sum Jay-android-experimental.apk Jay-Vanilla-26.3.mrpack > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          直接下载 Jay-android-experimental.apk。支持 Android 8.0 及以上的 ARM64 和 x86_64 设备。

          下载 Jay-Vanilla-26.3.mrpack 后，在启动器的「发现」页点「导入整合包文件」，选中下载的文件。导入完成后，在游戏库启动 Jay Vanilla 26.3。首次安装需要联网下载游戏资源和 Java 运行环境。

          支持摇杆移动、滑动转向、攻击、使用、跳跃、疾跑、潜行、背包、丢弃、聊天键盘和快捷栏切换。游戏菜单使用直接触摸，操作按钮会自动隐藏，只保留 Esc。

          此发布从本版起使用固定的预览版签名，以后可覆盖升级并保留语言、设备身份和已保存的服务器。若此前安装过其他签名的测试包，Android 仍会拒绝首次覆盖安装。
          NOTES
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # android-preview is a moving preview channel. Keep its tag, assets and notes on the
            # exact commit that produced the APK instead of failing after the first publication.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-preview" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload android-preview Jay-android-experimental.apk Jay-Vanilla-26.3.mrpack SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-preview \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jay Android 预览版" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create android-preview Jay-android-experimental.apk Jay-Vanilla-26.3.mrpack SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jay Android 预览版" \
              --notes-file release-notes.md \
              --prerelease
          fi

  ios:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_android_preview
    # Keep the platform compile independent so a desktop-only/flaky test cannot hide iOS compiler failures.
    # .NET 10.0.403 installs the iOS 27.1 workload; this image has matching Xcode 27.1 as its default.
    # Pinned: 10.0.404 brings iOS 27.2, which refuses Xcode 27.1. Move both together when the image gets Xcode 27.2.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'

      - name: Install iOS workload
        # setup-dotnet 只锁 SDK 还不够；workload 默认会更新到最新 feature band。
        run: dotnet workload install ios --version 10.0.403

      - name: Build experimental iOS Simulator app
        run: >-
          dotnet build Amber.iOS/Amber.iOS.csproj -c Release
          -r iossimulator-arm64 -p:CodesignKey=-

      - name: Stage simulator app
        shell: bash
        run: |
          APP_PATH="$(find Amber.iOS/bin/Release/net10.0-ios/iossimulator-arm64 -type d -name 'Jay.app' -print -quit)"
          test -n "$APP_PATH"
          DISPLAY_VERSION="$(dotnet msbuild Amber.iOS/Amber.iOS.csproj -getProperty:ApplicationDisplayVersion)"
          BUILD_VERSION="$(dotnet msbuild Amber.iOS/Amber.iOS.csproj -getProperty:ApplicationVersion)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "$DISPLAY_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUILD_VERSION"
          mkdir -p ../packages
          tar -C "$(dirname "$APP_PATH")" -czf ../packages/Jay-ios-simulator-arm64-experimental.tar.gz "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-ios-simulator
          path: packages/Jay-ios-simulator-arm64-experimental.tar.gz
          if-no-files-found: error

  publish-experimental:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, android]
    # Never let an older main build overwrite a newer rolling download.
    concurrency:
      group: experimental-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'jay-*'
          path: release-assets
          merge-multiple: true

      - name: Validate rolling download assets
        shell: bash
        run: |
          cd release-assets
          for asset in \
            Jay-win-x64.zip \
            Jay-osx-arm64.dmg \
            Jay-osx-x64.dmg \
            Jay-linux-x64.tar.gz \
            Jay-linux-arm64.tar.gz \
            Jay-android-experimental.apk \
            Jay-Vanilla-26.3.mrpack
          do
            test -s "$asset"
          done
          sha256sum \
            Jay-win-x64.zip \
            Jay-osx-arm64.dmg \
            Jay-osx-x64.dmg \
            Jay-linux-x64.tar.gz \
            Jay-linux-arm64.tar.gz \
            Jay-android-experimental.apk \
            Jay-Vanilla-26.3.mrpack \
            > SHA256SUMS.txt

      - name: Publish rolling website downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/experimental" --jq .object.sha 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status)
            case "$status" in
              ahead) ;;
              behind)
                echo "experimental is already newer than $GITHUB_SHA; skipping."
                exit 0 ;;
              *)
                echo "::warning::experimental and $GITHUB_SHA diverged ($status); skipping."
                exit 0 ;;
            esac
          fi

          cat > release-notes.md <<'NOTES'
          Jay 滚动实验版。此下载通道随 main 构建自动更新，供网站访客直接下载。

          包含 Windows x64、macOS Apple 芯片、macOS Intel、Linux x64、Linux ARM64 与 Android。
          NOTES

          assets=(
            release-assets/Jay-win-x64.zip
            release-assets/Jay-osx-arm64.dmg
            release-assets/Jay-osx-x64.dmg
            release-assets/Jay-linux-x64.tar.gz
            release-assets/Jay-linux-arm64.tar.gz
            release-assets/Jay-android-experimental.apk
            release-assets/Jay-Vanilla-26.3.mrpack
            release-assets/SHA256SUMS.txt
          )
          if gh release view experimental --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/experimental" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload experimental "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit experimental \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jay 滚动实验版" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create experimental "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jay 滚动实验版" \
              --notes-file release-notes.md \
              --prerelease
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # Desktop installers, portable packages and servers.
          pattern: 'jay-{win,osx,linux}-*'
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jay-android
          path: android-release
      - name: Stage the channel-signed Android update
        run: |
          cp android-release/Jay-android-experimental.apk release-assets/Jay-android.apk
          for installer in Jay-win-x64-setup.exe Jay-osx-arm64.pkg Jay-osx-x64.pkg Jay-android.apk; do
            test -s "release-assets/$installer"
          done

      # Jay release signature (privacy plan item 2): 2 of the 3 trustees sign this list offline
      # (`jay-server release prepare` / `cosign`), then SHA256SUMS.txt.sigs (and trust-chain.json, once the
      # trustee list has changed) is uploaded and the draft published. Jay only offers an update once that
      # file verifies; see docs/security/release-signing.md. CI never holds a trustee key.
      - name: SHA-256 list
        run: |
          cd release-assets
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft until the trustees have signed it: drafts don't show up as "latest" for the update check.
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --notes "代码签名政策 / Code signing policy: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/code-signing-policy.md" \
            --generate-notes \
            --title "Jay ${GITHUB_REF_NAME}"
