name: android-runtime

on:
  pull_request:
    paths:
      - '.github/workflows/android-runtime.yml'
      - 'scripts/check-android-runtime.sh'
      - 'scripts/check-android-console-log.sh'
      - 'scripts/assemble-android-runtime.sh'
      - 'scripts/create-android-runtime-descriptor.sh'
      - 'scripts/prepare-android-openjdk.sh'
      - 'scripts/build-android-mobileglues.sh'
      - 'scripts/build-android-shader-tools.sh'
      - 'scripts/build-android-lwjgl.sh'
      - 'scripts/build-android-lwjgl-vma.sh'
      - 'scripts/fetch-android-jna.sh'
      - 'scripts/build-android-sdl.sh'
      - 'third_party/android-openjdk/**'
      - 'third_party/android-mobileglues/**'
      - 'third_party/android-shader-tools/**'
      - 'third_party/android-lwjgl/**'
      - 'third_party/android-sdl/**'
      - 'src/Amber.Android/Java/**'
      - 'src/Amber.Android/NativeJvmHost.cs'
      - 'src/Amber.Android.Native/**'
      - 'scripts/build-android-native.sh'
  workflow_dispatch:
    inputs:
      architecture:
        description: Android runtime architecture
        type: choice
        options: [all, arm64-v8a, x86_64]
        default: all
      publish_runtime:
        description: Publish the verified android-runtime-v2 assets (main + all architectures only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pull_request runs execute a synthetic merge commit. Record the durable branch
# head instead so published descriptors keep pointing at an auditable source.
env:
  JAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  sdl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android native build tools
        shell: bash
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build pinned SDL for both APK architectures
        shell: bash
        run: bash scripts/build-android-sdl.sh "$ANDROID_HOME" "$JAVA_HOME" sdl-artifact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android-sdl
          path: sdl-artifact
          if-no-files-found: error
          retention-days: 14

  native-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android NDK
        shell: bash
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build embedded JVM host
        shell: bash
        run: bash scripts/build-android-native.sh "$ANDROID_HOME" native-host

  build:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64-v8a","x86_64"]' || (inputs.architecture == 'all' && '["arm64-v8a","x86_64"]' || format('["{0}"]', inputs.architecture))) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Android console bridge
        shell: bash
        run: bash scripts/check-android-console-log.sh

      - name: Fetch pinned Android OpenJDK 25 build source
        shell: bash
        run: |
          git clone https://github.com/FCL-Team/Android-OpenJDK-Build.git runtime-source
          git -C runtime-source checkout 7a0266e745d9b4acf400afa189b58e672900f710
          bash scripts/prepare-android-openjdk.sh runtime-source

      - name: Build OpenJDK 25
        shell: bash
        run: |
          case "${{ matrix.architecture }}" in
            arm64-v8a) script=ci_build_arch_aarch64.sh ;;
            x86_64) script=ci_build_arch_x86_64.sh ;;
          esac
          cd runtime-source
          JOBS=4 bash "$script"

      - name: Verify and stage JRE
        shell: bash
        run: |
          source_archive="$(find runtime-source -maxdepth 1 -type f -name 'jre25-*.tar.xz' -print -quit)"
          test -n "$source_archive"
          normalized="$(mktemp -d)"
          tar -xf "$source_archive" -C "$normalized"
          mkdir -p runtime-artifact
          archive="runtime-artifact/jay-jre25-${{ matrix.architecture }}.tar.xz"
          # The installer intentionally rejects both symbolic and hard links. Dereference
          # both kinds so every activated runtime path is an independently verified file.
          tar --hard-dereference -C "$normalized" -cJhf "$archive" .
          readelf_path="runtime-source/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bash scripts/check-android-runtime.sh \
            "$archive" "${{ matrix.architecture }}" "$readelf_path" 25 jre-only
          archive_directory="$(dirname "$archive")"
          archive_name="$(basename "$archive")"
          (cd "$archive_directory" && sha256sum "$archive_name" > "$archive_name.sha256")
          grep -Eq "^[0-9a-f]{64}  ${archive_name}$" "$archive.sha256"

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          # yes exits non-zero (EPIPE) after sdkmanager stops reading.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build renderer and shader libraries
        shell: bash
        env:
          JAY_RUN_HOST_TESTS: 1
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          graphics="graphics-${{ matrix.architecture }}"
          bash scripts/build-android-mobileglues.sh \
            "$ndk" "${{ matrix.architecture }}" "$graphics"
          bash scripts/build-android-shader-tools.sh \
            "$ndk" "${{ matrix.architecture }}" "$graphics"

      - name: Build LWJGL native libraries
        shell: bash
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          lwjgl="lwjgl-${{ matrix.architecture }}"
          bash scripts/build-android-lwjgl.sh \
            "$ndk" "${{ matrix.architecture }}" "$lwjgl"
          bash scripts/build-android-lwjgl-vma.sh \
            "$ndk" "${{ matrix.architecture }}" "$lwjgl"
          bash scripts/fetch-android-jna.sh \
            "$ndk" "${{ matrix.architecture }}" "$lwjgl"

      - name: Assemble complete Java 25 game runtime
        shell: bash
        run: |
          jre="runtime-artifact/jay-jre25-${{ matrix.architecture }}.tar.xz"
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          output="runtime-artifact/jay-android-runtime25-${{ matrix.architecture }}.tar.xz"
          bash scripts/assemble-android-runtime.sh \
            "$jre" \
            "graphics-${{ matrix.architecture }}" \
            "lwjgl-${{ matrix.architecture }}" \
            "${{ matrix.architecture }}" \
            "$readelf" \
            "$output" \
            25
          bash scripts/create-android-runtime-descriptor.sh \
            "$output" \
            "${{ matrix.architecture }}" \
            "${{ github.server_url }}/${{ github.repository }}/tree/$JAY_SOURCE_SHA" \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/android-runtime-v2/$(basename "$output")" \
            "runtime-artifact/runtime25-${{ matrix.architecture }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-android-runtime25-${{ matrix.architecture }}
          path: runtime-artifact/*
          if-no-files-found: error
          retention-days: 14

  publish-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.architecture == 'all' &&
      inputs.publish_runtime
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: jay-android-runtime25-*
          path: runtime-artifacts
          merge-multiple: true

      - name: Verify release files and descriptors
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for architecture in arm64-v8a x86_64; do
            archive="runtime-artifacts/jay-android-runtime25-$architecture.tar.xz"
            checksum="$archive.sha256"
            metadata="$archive.metadata"
            descriptor="runtime-artifacts/runtime25-$architecture.json"
            test -f "$archive"
            test -f "$checksum"
            test -f "$metadata"
            test -f "$descriptor"
            (cd runtime-artifacts && sha256sum --check --strict "$(basename "$checksum")")
            archive_size="$(wc -c < "$archive" | tr -d ' ')"
            archive_hash="$(sha256sum "$archive" | cut -d' ' -f1)"
            metadata_archive="$(sed -n 's/^archive-bytes=//p' "$metadata")"
            extracted_size="$(sed -n 's/^extracted-bytes=//p' "$metadata")"
            expected_id="jay-android-runtime25-v2-$architecture"
            expected_source="${{ github.server_url }}/${{ github.repository }}/tree/$JAY_SOURCE_SHA"
            expected_download="${{ github.server_url }}/${{ github.repository }}/releases/download/android-runtime-v2/$(basename "$archive")"
            test "$metadata_archive" = "$archive_size"
            [[ "$extracted_size" =~ ^[0-9]+$ ]]
            jq -e \
              --arg architecture "$architecture" \
              --arg id "$expected_id" \
              --argjson archiveSize "$archive_size" \
              --arg archiveHash "$archive_hash" \
              --argjson extractedSize "$extracted_size" \
              --arg sourceUrl "$expected_source" \
              --arg downloadUrl "$expected_download" \
              '.Format == 1 and .Id == $id and .Architecture == $architecture and
               .ArchiveSize == $archiveSize and .ArchiveSha256 == $archiveHash and
               .MaximumExtractedSize == $extractedSize and (.License | length) > 0 and
               .SourceUrl == $sourceUrl and .DownloadUrl == $downloadUrl' \
              "$descriptor" >/dev/null
            cp "$archive" "$checksum" "$metadata" "$descriptor" release-assets/
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8

      - name: Publish immutable Android runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-runtime-v2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace immutable runtime assets."
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jay Android Java 25 runtime v2" \
            --notes "Verified Java 25 game runtimes for ARM64 and x86_64. Built from $JAY_SOURCE_SHA; includes exact checksums, extracted-size limits and source/license metadata."
