name: networks

# Public network registry: only checks the format of networks/*.json.
# Reviewing (signing) happens offline: the Jay trustees co-sign with their own keys (2 of 3), see networks/README.md.
# CI never holds a signing key.
on:
  pull_request:
    paths: ['networks/**']
  push:
    branches: [main]
    paths: ['networks/**']

# 同一个 PR 推了新提交时，取消旧提交还在排队或在跑的检查；main 和标签上的不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Check network files
        shell: bash
        run: |
          shopt -s nullglob
          files=(networks/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "networks/ 里还没有网络"; exit 0; fi
          dotnet run --project src/Amber.Server -c Release -- network check "${files[@]}"
