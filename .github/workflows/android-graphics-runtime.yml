name: android-graphics-runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-v8a, x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex glslang-tools libvulkan-dev pkg-config python3-pip
          python3 -m pip install --user 'meson==1.9.1' 'mako==1.3.10' 'PyYAML==6.0.3' 'packaging==25.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build Mesa Zink
        run: |
          bash scripts/build-android-mesa.sh \
            "$ANDROID_HOME/ndk/28.2.13676358" \
            "${{ matrix.architecture }}" \
            "graphics-${{ matrix.architecture }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jay-mesa-zink-${{ matrix.architecture }}
          path: graphics-${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 14
