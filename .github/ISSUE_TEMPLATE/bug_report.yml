name: Bug report / 问题反馈
description: Jay errors, crashes or gives a wrong result / Jay 出错、崩溃或者结果不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search for an existing issue first, and blur account names, tokens, invite codes and local paths in screenshots and logs. Any language is welcome; English is preferred.

        感谢反馈。提交前请先搜一下有没有相同的 issue。截图、日志里如果有账号名、令牌、邀请码或本机路径，请先打码。
  - type: input
    id: version
    attributes:
      label: Jay version / Jay 版本
      description: The version on the Release page, or the commit if you built from source / Release 页面上的版本号，自己构建的写提交号
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: instance
    attributes:
      label: Game version and mod loader / 游戏版本和加载器
      description: Optional if the problem isn't about a game / 和游戏无关的问题可以不填
      placeholder: 1.21.1 + Fabric 0.16.9
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: What you saw and what you expected / 你看到的现象，以及你原本期望的结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 怎么复现
      description: Step by step; the more specific, the easier to find the cause / 一步一步写，越具体越好
      placeholder: |
        1. Open the Resources page and search for …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Game log, crash report or screenshots. Attach long logs as files. / 游戏日志、崩溃报告或截图，长日志可作为附件上传。
