name: Feature request / 功能建议
description: An idea for a new feature or an improvement / 新功能或者改进现有功能的想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / 遇到的问题
      description: What is inconvenient today, and when / 现在哪里不方便，在什么场景下遇到
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 希望怎么改
      description: How you'd like it to work. You can mention similar features elsewhere, but describe the behaviour rather than pasting their code. / 你设想的做法，可以提其他启动器的类似功能，但请描述效果，不用贴别家代码。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else / 补充
      description: Screenshots, mock-ups or other thoughts / 截图、示意图或其他想法
