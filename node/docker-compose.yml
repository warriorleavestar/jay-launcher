# Amber 联机节点（Docker 版）/ Amber relay node (Docker)
# 用法 / usage:
#   1. 在同一个文件夹放 Dockerfile，并建 .env 写一行 NODE_SECRET=<一串随机字符>（只用来给节点一个身份；不设置就不启动）
#      put Dockerfile next to this file and create .env with NODE_SECRET=<a random string> (compose refuses to start without it)
#   2. docker compose up -d --build（镜像在本机构建：Jay 加固版 EasyTier，固定版本并校验 SHA-256）
#      docker compose up -d --build (builds the image locally: Jay's hardened EasyTier, pinned and SHA-256 checked)
#   3. 在云服务器安全组放行 TCP 和 UDP 11010 / open TCP and UDP 11010 in your security group
#   4. 在 Amber 联机页添加节点 tcp://<你的公网 IP>:11010 / add tcp://<public IP>:11010 in Amber
# 只转发 Jay 房间：relay-network-whitelist 是 jay-* 和 amber-*（一个参数，空格隔开）；想转发所有 EasyTier 网络就改成 '*'。
# Relays Jay rooms only (jay-* and amber-*, one argument, separated by a space); change the whitelist to '*' to relay every EasyTier network.

services:
  amber-node:
    build: .
    image: jay-node-local:2.6.4-jay-3
    container_name: amber-node
    restart: unless-stopped
    ports:
      - "11010:11010/tcp"
      - "11010:11010/udp"
    command:
      - --network-name
      - amber-node-change-me
      - --network-secret
      - ${NODE_SECRET:?set NODE_SECRET in .env next to docker-compose.yml}
      - --no-tun
      - --listeners
      - tcp://0.0.0.0:11010
      - udp://0.0.0.0:11010
      - --relay-network-whitelist
      - jay-* amber-*
      - --hostname
      - amber-node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
